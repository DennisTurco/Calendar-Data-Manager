{% extends "base.html" %}
{% import "macros/ui.html" as ui %}

{% block title %}Page not found{% endblock %}

{% block body %}
<main class="min-h-screen grid place-items-center px-4 py-16 text-center">
    <div class="max-w-md">
        <p class="text-sm font-semibold text-accent">404</p>
        <h1 class="text-3xl font-bold tracking-tight mt-2">Page not found</h1>
        <p class="text-muted mt-3">The page you're looking for doesn't exist or has moved.</p>
        <a href="/" class="btn btn-primary mt-8">{{ ui.icon('arrow-left') }} Back to home</a>
    </div>
</main>
{% endblock %}
