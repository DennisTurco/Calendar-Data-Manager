<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}{% if self.title() %} · {% endif %}Calendar Data Manager</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
    <link rel="icon" type="image/png" sizes="213x211" href="{{ url_for('static', filename='images/icon.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/icon.png') }}">
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0c0e13" media="(prefers-color-scheme: dark)">
    <meta name="description" content="Create, bulk-edit and analyze your Google Calendar events.">
    <meta name="view-transition" content="same-origin">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Component styles first, so Tailwind utilities (e.g. lg:hidden) can override them -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <!-- Compiled from static/src/tailwind.input.css: run `npm run build:css` in web_app/ after changing templates -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
    <!-- Apply theme before first paint to avoid a flash of the wrong theme -->
    <script src="{{ url_for('static', filename='js/darkmode.js') }}"></script>
    {% block head %}{% endblock %}
</head>
<body class="min-h-screen {% block body_class %}{% endblock %}">

    {% include "components/toast.html" %}

    {% block body %}{% endblock %}

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
