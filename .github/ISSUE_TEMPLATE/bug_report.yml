name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: "🐛 [BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below as completely as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include any error messages or stack traces.
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How severe/urgent is this bug?
      options:
        - Critical (crash, data loss, blocks usage)
        - High (major feature broken)
        - Medium (partial functionality affected)
        - Low (minor/cosmetic issue)
        - Lowest (minor/cosmetic issue)
      default: 2
    validations:
      required: false

  - type: dropdown
    id: version
    attributes:
      label: App Version
      description: |
        Which version were you using? See the [Releases page](https://github.com/DennisTurco/TranscriptorAI/releases).
        NOTE: this list must be updated manually as new versions are released.
      options:
        - Latest release
        - main / development build
        - Older release (specify in "Additional Context")
        - Not sure
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g. Windows 11"
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain the problem. You can drag and drop images here.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context or notes about the problem.
    validations:
      required: false
